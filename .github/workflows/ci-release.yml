name: CI and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run unit tests
        run: cargo test --locked

      - name: Build release plugin
        run: cargo build --release --locked

      - name: Package release archive
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $stage = "dist/property-lines-$tag-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/release/ocs_property_lines.dll" "$stage/opencad.property_lines-windows-x86_64.dll"
          Copy-Item "plugin.toml" "$stage/plugin.toml"
          Copy-Item "README.md" "$stage/README.md"
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" "$stage/LICENSE" }
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/property-lines-$tag-windows-x86_64.zip" -Force

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/property-lines-${{ github.ref_name }}-windows-x86_64.zip
